name: Call Claude

on:
  push:
    branches: [main]
  workflow_dispatch:   # adds a "Run workflow" button in the Actions tab

permissions:
  id-token: write
  contents: read

jobs:
  call-claude:
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_FEDERATION_RULE_ID: ${{ vars.ANTHROPIC_FEDERATION_RULE_ID }}
      ANTHROPIC_ORGANIZATION_ID: ${{ vars.ANTHROPIC_ORGANIZATION_ID }}
      ANTHROPIC_SERVICE_ACCOUNT_ID: ${{ vars.ANTHROPIC_SERVICE_ACCOUNT_ID }}
      ANTHROPIC_WORKSPACE_ID: ${{ vars.ANTHROPIC_WORKSPACE_ID }}
      ANTHROPIC_IDENTITY_TOKEN_FILE: /tmp/gha-jwt
    steps:
      - uses: actions/checkout@v5

      - name: Fetch GitHub OIDC token
        run: |
          curl -sS -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://api.anthropic.com" \
            | jq -r .value > "$ANTHROPIC_IDENTITY_TOKEN_FILE"

      - name: Check setup
        run: |
          missing=0
          for v in ANTHROPIC_FEDERATION_RULE_ID ANTHROPIC_ORGANIZATION_ID ANTHROPIC_SERVICE_ACCOUNT_ID ANTHROPIC_WORKSPACE_ID; do
            if [ -z "${!v}" ]; then
              echo "::error::Repo variable $v is not set (Settings > Secrets and variables > Actions > Variables)"
              missing=1
            else
              echo "OK: $v is set"
            fi
          done
          if [ ! -s "$ANTHROPIC_IDENTITY_TOKEN_FILE" ] || [ "$(cat "$ANTHROPIC_IDENTITY_TOKEN_FILE")" = "null" ]; then
            echo "::error::GitHub identity token was not fetched (check 'permissions: id-token: write')"
            missing=1
          else
            python3 - <<'PY'
          import base64, json, os
          tok = open(os.environ["ANTHROPIC_IDENTITY_TOKEN_FILE"]).read().strip()
          payload = tok.split(".")[1]
          payload += "=" * (-len(payload) % 4)
          claims = json.loads(base64.urlsafe_b64decode(payload))
          print("Token subject: ", claims.get("sub"))
          print("Token audience:", claims.get("aud"))
          print("Token issuer:  ", claims.get("iss"))
          PY
          fi
          exit $missing

      - name: Test call to Claude
        run: |
          pip install --quiet anthropic
          python3 - <<'PY'
          import anthropic
          client = anthropic.Anthropic()  # uses the federation env vars, no API key
          msg = client.messages.create(
              model="claude-sonnet-5-5",
              max_tokens=100,
              messages=[{"role": "user", "content": "Say hello from GitHub Actions."}],
          )
          print(msg.content[0].text)
          PY
